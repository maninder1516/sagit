security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    
    # Remove admin inheriting client role
    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_CLIENT, ROLE_ALLOWED_TO_SWITCH]
    
    firewalls:
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator
            # if you're using form_login instead of custom_authenticator, enable CSRF:
            form_login:
                login_path: sagit_login
                check_path: sagit_login
                default_target_path: sagit_mission
                # or you might need: always_use_default_target_path: true

            logout:
                path: sagit_logout
                target: sagit_login
            # Remove the form_login entry if you're using custom_authenticator
            # Add this entry_point configuration to resolve the error
            entry_point: App\Security\LoginFormAuthenticator
            # or if you prefer to use form_login as entry point:
            # entry_point: form_login

    # Easy way to control access for large sections of your site
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        # Explicitly restrict mission creation to client role only
        - { path: ^/mission/new, roles: ROLE_CLIENT }
        # Allow both client and admin to access other mission paths
        - { path: ^/mission, roles: [ROLE_CLIENT, ROLE_ADMIN] }
        - { path: ^/, roles: [ROLE_CLIENT, ROLE_ADMIN] }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
